[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reranking-strategies"
version = "0.1.0"
description = "A reproducible hybrid retrieval and reranking evaluation lab"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = []
cross-encoder = ["sentence-transformers>=3"]
cross-encoder-training = [
    "sentence-transformers>=4.0",
    "datasets>=3.0",
    "accelerate>=1.1",
]
qdrant = ["qdrant-client[fastembed]>=1.20,<1.21"]
llm-judge = ["openai>=1.100"]

[project.scripts]
rerank-lab = "reranking_strategies.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
